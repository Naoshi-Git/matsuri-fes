<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f5">
  <title>{{ page.title }} — Sailing KOBE</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="reading-page" id="top">
  <main class="access-gate" id="access-gate">
    <p class="eyebrow">SAILING KOBE <span>／</span> CAREER BOOK</p>
    <h1>Sailing就活</h1>
    <p class="gate-note">閲覧にはパスワードが必要です。公開期間は2026年10月22日まで。</p>
    <form id="access-form">
      <label for="access-password">パスワード</label>
      <div class="password-row">
        <input id="access-password" type="password" autocomplete="current-password" required>
        <button type="submit">読む</button>
      </div>
      <p id="access-message" role="status" aria-live="polite"></p>
    </form>
    <span class="gate-credit">© 祭りフェス実行委員会</span>
  </main>

  <div id="reader-site" hidden>
    <header class="sailing-bar">
      <a class="sailing-wordmark" href="{{ '/' | relative_url }}">
        <span>SAILING KOBE<small>CAREER BOOKS</small></span>
      </a>
      <span class="bar-note">就活対策資料　·　2026</span>
    </header>

    <main class="pdf-reader">
      <div class="pdf-reader-head">
        <p class="eyebrow">SAILING KOBE <span>／</span> CAREER BOOK</p>
        <h1>Sailing就活</h1>
        <p class="reader-deck">よさこいで担った仕事を、選考で伝わる言葉へ。</p>
      </div>
      <div class="pdf-frame-wrap">
        <iframe
          class="pdf-frame"
          title="Sailing就活 ES・面接対策BOOK"
          src="{{ '/assets/sailing-career-book.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH' | relative_url }}"
          loading="lazy"
          referrerpolicy="no-referrer"></iframe>
      </div>
      <p class="pdf-reader-note">このページ内で資料を閲覧できます。</p>
    </main>

    <footer class="site-footer reading-footer">
      <span>© 祭りフェス実行委員会</span>
      <span>Sailing KOBE · 就活対策資料</span>
      <a href="#top" onclick="window.scrollTo({top:0,behavior:'instant'});return false;">上へ戻る ↑</a>
    </footer>
  </div>

  <script>
  (() => {
    const gate = document.getElementById('access-gate');
    const reader = document.getElementById('reader-site');
    const form = document.getElementById('access-form');
    const message = document.getElementById('access-message');
    const reveal = () => { gate.hidden = true; reader.hidden = false; };
    const end = new Date('2026-10-22T23:59:59+09:00').getTime();
    if (Date.now() > end) {
      form.hidden = true;
      message.textContent = 'この資料のWeb公開期間は終了しました。';
      return;
    }
    if (sessionStorage.getItem('sailing-career-access') === 'ok') reveal();
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const value = document.getElementById('access-password').value;
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      const hash = [...new Uint8Array(digest)].map(n => n.toString(16).padStart(2, '0')).join('');
      if (hash === 'de6c2cab5e001e28e85846700ffef3b53dff59617d6b3e2800f3c11cf12a3fbc') {
        sessionStorage.setItem('sailing-career-access', 'ok');
        reveal();
      } else {
        message.textContent = 'パスワードを確認してください。';
      }
    });
    document.addEventListener('contextmenu', event => {
      if (reader && !reader.hidden) event.preventDefault();
    });
    document.addEventListener('keydown', event => {
      if (reader && !reader.hidden && (event.metaKey || event.ctrlKey) && ['p', 's', 'u'].includes(event.key.toLowerCase())) event.preventDefault();
    });
  })();
  </script>
</body>
</html>
